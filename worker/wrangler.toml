# Gratuit : compte Cloudflare (Workers + KV + crons).
# Automatique :  npx wrangler login   puis   npm run setup
# (setup.mjs crée le KV, les clés VAPID, les secrets et lance deploy.)

name = "planning-pwa-v2-push"
main = "src/index.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_ME"
preview_id = "REPLACE_ME"

[triggers]
crons = ["* * * * *"]

[vars]
VAPID_PUBLIC_KEY = "REPLACE_PUBLIC_KEY"
VAPID_SUBJECT = "mailto:example@example.com"
